name: Deploy Archive and Reading Sites to Pages

on:
  push:
    branches: [main]
    paths:
      - 'GPT_PUBLIC_ARCHIVE_READY.zip'
      - '초기불교_완전입문/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack archive
        run: |
          rm -rf _site_src
          mkdir -p _site_src
          unzip -q GPT_PUBLIC_ARCHIVE_READY.zip -d _site_src
          test -f _site_src/publish_site/index.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build existing archive with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src/publish_site
          destination: ./_site

      - name: Add Early Buddhism web book
        run: |
          mkdir -p _site/early-buddhism/content
          cp 초기불교_완전입문/site/index.html _site/early-buddhism/index.html
          cp 초기불교_완전입문/site/style.css _site/early-buddhism/style.css
          cp 초기불교_완전입문/site/app.js _site/early-buddhism/app.js
          cp 초기불교_완전입문/*.md _site/early-buddhism/content/
          rm -f _site/early-buddhism/content/README.md
          test -f _site/early-buddhism/index.html
          test "$(find _site/early-buddhism/content -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 13

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
