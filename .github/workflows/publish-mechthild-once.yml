name: Publish verified Mechthild webbook once

on:
  pull_request:
    branches: [main]
    paths:
      - '.mechthild-pr-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download publication package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/mechthild.zip \
            'https://drive.usercontent.google.com/download?id=1iu7LW92J_997wATTPjsPnaOYZA-KdeUO&export=download&confirm=t'
          unzip -t /tmp/mechthild.zip >/dev/null
          rm -rf /tmp/mechthild-package
          mkdir -p /tmp/mechthild-package
          unzip -q /tmp/mechthild.zip -d /tmp/mechthild-package

      - name: Verify package against current uploaded source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('/tmp/mechthild-package/chapters')
          files = sorted(root.glob('*.md'))
          if len(files) != 44:
              raise SystemExit(f'expected 44 Markdown chapters, got {len(files)}')
          h = hashlib.sha256()
          for p in files:
              h.update(p.name.encode('utf-8')); h.update(b'\0')
              h.update(p.read_bytes()); h.update(b'\0')
          expected = '571c2256bff1402ab9844e9d7e89bd5363d0f7568deebaba3dd031729de7deed'
          if h.hexdigest() != expected:
              raise SystemExit('Drive package differs from current uploaded ZIP; publication stopped')
          content = Path('/tmp/mechthild-package/site_content')
          wanted = {0:1, 1:4, 2:4, 3:5, 4:5, 5:6, 6:7, 7:10}
          total = 0
          for book, count in wanted.items():
              parts = sorted((content / f'book-{book}').glob('part-*.b64'))
              if len(parts) != count:
                  raise SystemExit(f'book-{book}: expected {count} reader parts, got {len(parts)}')
              total += len(parts)
          if total != 42:
              raise SystemExit(f'expected 42 reader parts, got {total}')
          if not Path('/tmp/mechthild-package/book.yaml').is_file():
              raise SystemExit('book.yaml missing')
          print('Verified: current source = Drive package; 44 Markdown chapters.')
          PY

      - name: Install new stable webbook path
        shell: bash
        run: |
          set -euo pipefail
          target='christianity/mechthild'
          test ! -e "$target"
          mkdir -p "$target"
          cp '초기불교_완전입문/site/mechthild/index.html' "$target/index.html"
          cp '초기불교_완전입문/site/mechthild/app.js' "$target/app.js"
          cp '초기불교_완전입문/site/mechthild/style.css' "$target/style.css"
          cp -R /tmp/mechthild-package/site_content "$target/content"
          cp /tmp/mechthild-package/book.yaml "$target/book.yaml"
          cp -R /tmp/mechthild-package/chapters "$target/chapters"
          python - <<'PY'
          from pathlib import Path
          p = Path('christianity/mechthild/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://github.com/disnotons/GPT/tree/main/초기불교_완전입문/site/mechthild', 'https://github.com/disnotons/GPT/tree/main/christianity/mechthild')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit complete publication in one commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add christianity/mechthild
          git rm -f .mechthild-publish-trigger || true
          git rm .github/workflows/publish-mechthild-once.yml
          git commit -m 'Publish Mechthild webbook'
          git push origin HEAD:main
