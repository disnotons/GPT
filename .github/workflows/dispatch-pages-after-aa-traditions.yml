name: Deploy Pages after AA Twelve Traditions publisher

on:
  workflow_run:
    workflows: ['Publish AA Twelve Traditions detailed webbook']
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-pages:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main'
            });
