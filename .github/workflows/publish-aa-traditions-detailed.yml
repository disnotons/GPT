name: Publish AA Twelve Traditions detailed webbook

on:
  push:
    branches: [main]
    paths:
      - '초기불교/aa/.trigger-detailed-publisher'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch validated Drive source, build, and publish
        shell: bash
        run: |
          set -u
          log='.webbook-upload/aa-traditions-detailed/last-publish.log'
          set +e
          {
            curl -L --fail --retry 3 --retry-delay 2 \
              'https://drive.usercontent.google.com/download?id=1kUnZMmIHhB0F0CfZ-WDnawr5w9jtsTwK&export=download&confirm=t' \
              -o /tmp/aa-traditions.zip
            file /tmp/aa-traditions.zip
            unzip -t /tmp/aa-traditions.zip >/dev/null
            rm -rf /tmp/aa-traditions-src
            mkdir -p /tmp/aa-traditions-src
            unzip -q /tmp/aa-traditions.zip -d /tmp/aa-traditions-src
            src_md="$(find /tmp/aa-traditions-src -type f -name 'AA_12전통_상세분석해설_전체통합본_친절한설명조.md' -print -quit)"
            test -n "$src_md"
            got_sha="$(sha256sum "$src_md" | awk '{print $1}')"
            echo "validated source sha256: $got_sha"
            test "$got_sha" = 'b4d64ad1899b1de37548283fefbb3f4dd99844d8603844e03e0d9bee645183c7'
            cp "$src_md" /tmp/aa-integrated.md
            python .github/scripts/build_aa_traditions_integrated_webbook.py
          } > /tmp/aa-publish.log 2>&1
          status=$?
          set -e
          cp /tmp/aa-publish.log "$log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$status" -eq 0 ]; then
            git add '초기불교/aa/traditions-detailed' '.github/workflows/deploy-pages.yml' "$log"
            git commit -m 'Publish AA Twelve Traditions detailed webbook'
          else
            git add "$log"
            git commit -m 'Record AA detailed publisher failure'
          fi
          git push origin HEAD:main
          cat /tmp/aa-publish.log
          exit "$status"
