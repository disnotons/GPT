name: AA publication Actions diagnostic

on:
  push:
    branches: [main]
    paths:
      - '초기불교/aa/.trigger-aa-action-diagnostic'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit diagnostic marker
        shell: bash
        run: |
          set -euo pipefail
          printf 'actions-ok\n' > '초기불교/aa/.aa-action-ran'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '초기불교/aa/.aa-action-ran'
          git commit -m 'Confirm AA publication Actions runner'
          git push origin HEAD:main
