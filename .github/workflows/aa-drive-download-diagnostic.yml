name: AA Drive download diagnostic

on:
  push:
    branches: [main]
    paths:
      - '초기불교/aa/.trigger-aa-drive-diagnostic'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect unauthenticated Drive interstitial
        shell: bash
        run: |
          set +e
          log='.webbook-upload/aa-traditions-detailed/drive-download.log'
          curl -L --silent --show-error 'https://drive.usercontent.google.com/download?id=1kUnZMmIHhB0F0CfZ-WDnawr5w9jtsTwK&export=download&confirm=t' -o /tmp/aa-drive.html
          python - <<'PY' > "$log" 2>&1
          from pathlib import Path
          import re, html
          p=Path('/tmp/aa-drive.html')
          s=p.read_text(errors='replace') if p.exists() else ''
          print('size=',len(s))
          for key in ['request_access','accounts.google.com','confirm=','download-form','uc-download-link','drive.usercontent.google.com','resourcekey','permission','Sign in','You need access']:
              print(key, s.lower().count(key.lower()))
          urls=[]
          for m in re.findall(r'https?[^"\'<> ]+',s):
              u=html.unescape(m.replace('\\u003d','=').replace('\\u0026','&'))
              if 'download' in u.lower() or 'usercontent' in u.lower():
                  urls.append(u[:1000])
          print('candidate_urls=',len(urls))
          for u in urls[:20]: print(u)
          for pat in [r'confirm[=:][^&"\' ]{1,120}',r'resourcekey[=:][^&"\' ]{1,200}']:
              hits=re.findall(pat,s,re.I)
              print('pattern',pat,'hits',hits[:20])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log"
          git commit -m 'Record AA Drive interstitial diagnostic'
          git push origin HEAD:main
