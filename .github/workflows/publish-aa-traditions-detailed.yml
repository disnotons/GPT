name: Publish AA Twelve Traditions detailed webbook

on:
  push:
    branches: [main]
    paths:
      - '초기불교/aa/.trigger-detailed-publisher'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verified webbook
        run: python .github/scripts/build_aa_traditions_detailed.py

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '초기불교/aa/traditions-detailed' '.github/workflows/deploy-pages.yml'
          git commit -m 'Publish AA Twelve Traditions detailed webbook'
          git push origin HEAD:main
