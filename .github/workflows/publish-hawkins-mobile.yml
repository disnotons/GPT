name: Hawkins Actions trigger test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hawkins-mobile.yml'

permissions:
  contents: write

jobs:
  trigger-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record trigger
        shell: bash
        run: |
          set -euo pipefail
          printf 'triggered\n' > hawkins-mobile/actions-triggered.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hawkins-mobile/actions-triggered.txt
          git commit -m 'Confirm Hawkins Actions trigger'
          git push origin HEAD:main
