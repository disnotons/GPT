name: Dispatch AA Twelve Traditions publisher

on:
  push:
    branches: [main]
    paths:
      - '초기불교/aa/.trigger-detailed-publisher'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch detailed publisher
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-aa-traditions-detailed.yml',
              ref: 'main'
            });
