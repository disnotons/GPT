name: Repair CW11 source chunk 01

on:
  push:
    branches: [main]
    paths:
      - '융_CW11_심리학과_종교/source-archive/fix/p01-a'
      - '융_CW11_심리학과_종교/source-archive/fix/p01-b'
      - '.github/workflows/fix-cw11-p01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact chunk
        shell: bash
        run: |
          set -euo pipefail
          a='융_CW11_심리학과_종교/source-archive/fix/p01-a'
          b='융_CW11_심리학과_종교/source-archive/fix/p01-b'
          base='융_CW11_심리학과_종교/source-archive/fix/p01-1'
          test "$(git hash-object "$a")" = '9548b6ba92541cde07a7dfa5c271eca0d566ac83'
          test "$(git hash-object "$b")" = '022e0c5534166fa34cbe003b347e40c342bc9354'
          cat "$a" "$b" > /tmp/p01-1
          test "$(wc -c < /tmp/p01-1 | tr -d ' ')" = '10000'
          test "$(git hash-object /tmp/p01-1)" = '9956212fbdc0752d3c0117d4dd3ad1fa26d878e5'
          cp /tmp/p01-1 "$base"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$base"
          if ! git diff --cached --quiet; then
            git commit -m 'Repair CW11 source chunk 01 [skip ci]'
            git push origin HEAD:main
          fi
