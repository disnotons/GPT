name: Deploy Archive and Reading Sites to Pages

on:
  push:
    branches: [main]
    paths:
      - 'GPT_PUBLIC_ARCHIVE_READY.zip'
      - '초기불교_완전입문/**'
      - '초기불교/aa/**'
      - '예수_그리스도_완전입문/**'
      - '융_CW11_심리학과_종교/**'
      - 'publications/CW11-심리학과-종교/**'
      - '임제록_통합해설/**'
      - 'hawkins-mobile/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site_src
          mkdir -p _site_src
          unzip -q GPT_PUBLIC_ARCHIVE_READY.zip -d _site_src
          test -f _site_src/publish_site/index.md

      - name: Stage Early Buddhism web book
        shell: bash
        run: |
          set -euo pipefail
          target="_site_src/publish_site/early-buddhism"
          mkdir -p "$target/content"
          cp -R "초기불교_완전입문/site/." "$target/"
          cp 초기불교_완전입문/*.md "$target/content/"
          rm -f "$target/content/README.md"
          test -f "$target/index.html"
          test -f "$target/style.css"
          test -f "$target/app.js"
          count="$(find "$target/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "Early Buddhism chapter docs: $count"
          test "$count" = "13"

      - name: Stage Jesus teachings web book
        shell: bash
        run: |
          set -euo pipefail
          target="_site_src/publish_site/jesus"
          mkdir -p "$target/content"
          cp -R "예수_그리스도_완전입문/site/." "$target/"
          cp 예수_그리스도_완전입문/*.md "$target/content/"
          rm -f "$target/content/README.md"
          cat "예수_그리스도_완전입문/site/_chapter5"/part-*.md > "$target/content/5강_재물_염려_마음의_방향_통합정제본.md"
          rm -rf "$target/_chapter5"
          cat "예수_그리스도_완전입문/site/_chapter12"/part-*.md > "$target/content/12강_돌아옴_진리_사랑_성령_평화_통합정제본.md"
          rm -rf "$target/_chapter12"
          test "$(git hash-object "$target/content/5강_재물_염려_마음의_방향_통합정제본.md")" = "0f19a8a8fc27492d22d3b06f7ef6456aa1296172"
          test "$(git hash-object "$target/content/12강_돌아옴_진리_사랑_성령_평화_통합정제본.md")" = "92d8337cac990a5cea3a04ca978e404a7365c983"
          test -f "$target/index.html"
          test -f "$target/style.css"
          test -f "$target/app.js"
          count="$(find "$target/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "Jesus chapter docs: $count"
          test "$count" = "12"

      - name: Verify CW11 Terra source files
        shell: bash
        run: |
          set -euo pipefail
          src="publications/CW11-심리학과-종교"
          test -d "$src"
          count="$(find "$src" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "CW11 Terra docs: $count"
          test "$count" = "9"
          test "$(git hash-object "$src/CW11_1_심리학과종교_1.1-1.3_통합정제본.md")" = "913d0b629c15715c8f4eb1f442b6680e2d0cb87e"
          test "$(git hash-object "$src/CW11_2_삼위일체_교리에_대한_심리학적_접근_통합정제본.md")" = "0dd7a7ea009d08a6f397b6f5e3cf01060f9aabf2"
          test "$(git hash-object "$src/CW11_3_미사에서의_변환_상징_통합정제본.md")" = "922a3a6d04656467f241ad9b9be259dbbc3fdafc"
          test "$(git hash-object "$src/CW11_4_기독교_악_종교심리학_통합정제본.md")" = "5437df6bfd9acc05f50a4e1d88e32503d7a87c61"
          test "$(git hash-object "$src/CW11_5_심리치료와_종교_통합정제본.md")" = "673e4b9d5aae70e5f53a63d2099eb288b8a9dcf9"
          test "$(git hash-object "$src/CW11_6_욥에게_답하다_통합정제본.md")" = "6728d3ce2cabcaabb52af320cb1448daffa84ca9"
          test "$(git hash-object "$src/CW11_7_티베트_종교문헌_심리학적주석_통합정제본.md")" = "673ba93202539a4e689cce06aaa7f6f52d8822bf"
          test "$(git hash-object "$src/CW11_8_요가_선_명상_인도성자_통합정제본.md")" = "f5dddcc3b8269b7580cfd8263932ad2d145d68c5"
          test "$(git hash-object "$src/CW11_9_주역과_동시성_통합정제본.md")" = "235a9d20265a9a25f7e7eab35bf7697f6ec48b8b"

      - name: Stage Linji web book
        shell: bash
        run: |
          set -euo pipefail
          src="임제록_통합해설/source"
          test -d "$src"
          count_parts="$(find "$src" -maxdepth 1 -type f -name 'part-*.b64' | wc -l | tr -d ' ')"
          echo "Linji source parts: $count_parts"
          test "$count_parts" = "10"
          cat "$src"/part-*.b64 > /tmp/linji.b64
          base64 -d /tmp/linji.b64 > /tmp/linji-content.tar.bz2
          expected_sha="37701b75105b4dc9f0352fd2af48c8a3e93ee8fbd798c779fbc5f0e702016240"
          got_sha="$(sha256sum /tmp/linji-content.tar.bz2 | awk '{print $1}')"
          echo "Linji archive sha256: $got_sha"
          test "$got_sha" = "$expected_sha"
          target="_site_src/publish_site/linji"
          rm -rf "$target"
          mkdir -p "$target/content"
          cp -R "임제록_통합해설/site/." "$target/"
          tar -xjf /tmp/linji-content.tar.bz2 -C "$target/content"
          test -f "$target/index.html"
          test -f "$target/style.css"
          test -f "$target/app.js"
          count="$(find "$target/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "Linji docs: $count"
          test "$count" = "5"
          test "$(sha256sum "$target/content/임제록_제1부_시중_1.1-1.18_최종감수본.md" | awk '{print $1}')" = "f9bf29cce91f72a2bcdf1a329888c2c749dcf6510e1f25525717ceeee6f0452b"
          test "$(sha256sum "$target/content/임제록_제2부_상당_2.1-2.13_최종감수본.md" | awk '{print $1}')" = "48720f94044b276d7d36d795b4fbcb03dffc216612a48dbbc5a9493f68c1f31a"
          test "$(sha256sum "$target/content/임제록_제3부_감변_3.1-3.13_최종감수본.md" | awk '{print $1}')" = "3042fb3dc0d7aac3275f9839d7180346ffef8cb6593a943538a2ff5979b30ac7"
          test "$(sha256sum "$target/content/임제록_제4부_행록_4.1-4.15_최종감수본.md" | awk '{print $1}')" = "babccbb3db907090f223eb686c9512864e9779c79d908a61aef5771f454e27f9"
          test "$(sha256sum "$target/content/임제록_제5부_전체통합_5.1-5.12_최종감수본.md" | awk '{print $1}')" = "521aebc867670b51f502270b67399ee5dd738410b15daa53c8977306af2125a4"

      - name: Stage AA web book
        shell: bash
        run: |
          set -euo pipefail
          src="초기불교/aa"
          if [ ! -f "$src/index.html" ]; then
            echo 'AA webbook has not been generated yet; skipping this run.'
            exit 0
          fi
          target="_site_src/publish_site/aa"
          rm -rf "$target"
          mkdir -p "$target"
          cp -R "$src/." "$target/"
          test -f "$target/index.html"
          test -f "$target/style.css"
          test -f "$target/app.js"
          count="$(find "$target/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "AA docs: $count"
          test "$count" = "25"
          printf 'aa-route-ok\n' > "$target/health.txt"

      - name: Stage Hawkins mobile web books
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT='536a7997ad639ba9e512dd389c64c54afe231f5d'
          rm -rf /tmp/hawkins-source /tmp/hawkins-source.zip _site_src/publish_site/hawkins
          mkdir -p /tmp/hawkins-source _site_src/publish_site/hawkins
          git show "$SOURCE_COMMIT:GPT_PUBLIC_ARCHIVE_READY.zip" > /tmp/hawkins-source.zip
          unzip -t /tmp/hawkins-source.zip >/dev/null
          unzip -q /tmp/hawkins-source.zip 'publish_site/conversations/*' -d /tmp/hawkins-source
          python hawkins-mobile/build_hawkins.py \
            --conversations /tmp/hawkins-source/publish_site/conversations \
            --manifest hawkins-mobile/source-manifest.json \
            --reconstructed hawkins-mobile/truth-reconstructed \
            --output _site_src/publish_site/hawkins
          test -f _site_src/publish_site/hawkins/truth-vs-falsehood-mobile/index.md
          test -f _site_src/publish_site/hawkins/modern-consciousness-map-mobile/index.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_site_src/publish_site/hawkins/build-report.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['conversation_archive_count'] >= 1300, r
          assert len(r['results']) == 2, r
          for b in r['results']:
              assert b['max_part_chars'] <= r['hard_chars'], b
              assert b['pages'] >= b['chapters'], b
              print(b['book'], 'chapters=', b['chapters'], 'pages=', b['pages'], 'max_chars=', b['max_part_chars'])
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src/publish_site
          destination: ./_site

      - name: Ensure CW11 in final Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$USER":"$(id -gn)" _site
          src="publications/CW11-심리학과-종교"
          target="_site/cw11"
          rm -rf "$target"
          mkdir -p "$target/content"
          cp -R "융_CW11_심리학과_종교/site/." "$target/"
          cp "$src"/*.md "$target/content/"
          printf 'cw11-health-ok\n' > "$target/health.txt"
          test -f "$target/index.html"
          test -f "$target/app.js"
          test -f "$target/style.css"
          grep -qx 'cw11-health-ok' "$target/health.txt"
          count="$(find "$target/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "Final CW11 chapter docs: $count"
          test "$count" = "9"
          for f in "$src"/*.md; do
            out="$target/content/$(basename "$f")"
            test -f "$out"
            test "$(git hash-object "$f")" = "$(git hash-object "$out")"
          done

      - name: Verify Linji in built artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/linji/index.html
          test -f _site/linji/app.js
          test -f _site/linji/style.css
          count="$(find _site/linji/content -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "Built Linji docs: $count"
          test "$count" = "5"

      - name: Verify AA in built artifact when present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f _site/aa/index.html ]; then
            echo 'AA webbook not present in this run.'
            exit 0
          fi
          test -f _site/aa/app.js
          test -f _site/aa/style.css
          test -f _site/aa/health.txt
          count="$(find _site/aa/content -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "Built AA docs: $count"
          test "$count" = "25"
          grep -qx 'aa-route-ok' _site/aa/health.txt

      - name: Verify Hawkins mobile web books in built artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/hawkins/truth-vs-falsehood-mobile/index.html
          test -f _site/hawkins/modern-consciousness-map-mobile/index.html
          test -f _site/hawkins/truth-vs-falsehood-mobile/chapter-15/index.html
          test -f _site/hawkins/modern-consciousness-map-mobile/chapter-07/index.html
          if grep -RIl 'docs.google.com' _site/hawkins; then
            echo 'Unexpected Google Docs link in Hawkins mobile site.'
            exit 1
          fi
          truth_pages="$(find _site/hawkins/truth-vs-falsehood-mobile -type f -name '*.html' | wc -l | tr -d ' ')"
          modern_pages="$(find _site/hawkins/modern-consciousness-map-mobile -type f -name '*.html' | wc -l | tr -d ' ')"
          echo "Hawkins Truth HTML pages: $truth_pages"
          echo "Hawkins Modern HTML pages: $modern_pages"
          test "$truth_pages" -ge 19
          test "$modern_pages" -ge 20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
