name: Prune GPT archive to selected book commentary projects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-gpt-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only selected project conversations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, zlib, zipfile, pathlib, re, shutil, json, collections

          # 12-hex conversation-id prefix + project code, generated from the original ChatGPT export's
          # conversation_template_id values for the five requested book-commentary projects.
          payload = ''''''
          packed = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          label_by_code = {'J':'칼 융','F':'프로이트','H':'올더스 헉슬리','D':'데이비드 호킨스','B':'엘리스 베일리'}
          project_by_prefix = {}
          for line in packed.splitlines():
              if not line:
                  continue
              prefix, code = line[:12], line[12:]
              assert prefix not in project_by_prefix, prefix
              project_by_prefix[prefix] = label_by_code[code]

          src = pathlib.Path('GPT_PUBLIC_ARCHIVE_READY.zip')
          assert src.exists(), 'archive missing'
          tmp = pathlib.Path('_filtered_gpt_archive.zip')
          rows = []
          removed_paths = []
          stale_aux_removed = []

          def frontmatter(text, key):
              m = re.search(rf'(?m)^{re.escape(key)}:\s*["\']?(.*?)["\']?\s*$', text[:7000])
              return m.group(1).strip() if m else ''

          def should_replace_aux(name):
              low = name.lower()
              if name in {'publish_site/index.md','publish_site/index.html','publish_site/categories.md','publish_site/search.md','publish_site/search.html','publish_site/sitemap.xml','publish_site/feed.xml'}:
                  return True
              if name.startswith('publish_site/category/'):
                  return True
              base = pathlib.PurePosixPath(name).name.lower()
              if base in {'search.json','search-index.json','search_index.json','search.js','categories.json','categories.js'}:
                  return True
              return False

          with zipfile.ZipFile(src, 'r') as zin, zipfile.ZipFile(tmp, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
              for info in zin.infolist():
                  name = info.filename
                  data = zin.read(name)
                  if name.startswith('publish_site/conversations/') and name.endswith('.md'):
                      text = data.decode('utf-8','replace')
                      cid = frontmatter(text, 'conversation_id')
                      prefix = cid.replace('-','')[:12]
                      project = project_by_prefix.get(prefix)
                      if not project:
                          removed_paths.append(name)
                          continue
                      title = frontmatter(text, 'title') or pathlib.PurePosixPath(name).stem
                      date = frontmatter(text, 'date')
                      rows.append({'path':name,'cid':cid,'title':title,'date':date,'project':project})
                      zout.writestr(info, data)
                      continue
                  if should_replace_aux(name):
                      stale_aux_removed.append(name)
                      continue
                  zout.writestr(info, data)

              order = ['칼 융','프로이트','올더스 헉슬리','데이비드 호킨스','엘리스 베일리']
              slug = {'칼 융':'jung','프로이트':'freud','올더스 헉슬리':'huxley','데이비드 호킨스':'hawkins','엘리스 베일리':'bailey'}
              counts = collections.Counter(r['project'] for r in rows)
              rows.sort(key=lambda r:(r['date'],r['title']), reverse=True)

              index = ['---','layout: default','title: GPT 저서 해설 프로젝트','---','','# GPT 저서 해설 프로젝트','',f'현재 공개된 대화: **{len(rows)}개**','']
              for project in order:
                  group = [r for r in rows if r['project']==project]
                  index += [f'## {project} ({len(group)})','']
                  for r in group:
                      rel = r['path'].removeprefix('publish_site/').removesuffix('.md') + '.html'
                      safe_title = r['title'].replace('[','\\[').replace(']','\\]')
                      index.append(f'- [{safe_title}]({rel})')
                  index.append('')
              zout.writestr('publish_site/index.md', '\n'.join(index)+'\n')

              cats = ['---','layout: default','title: 저서 해설 프로젝트','---','','# 저서 해설 프로젝트','']
              for project in order:
                  cats.append(f'- [{project} ({counts[project]})](category/{slug[project]}.html)')
              cats.append('')
              zout.writestr('publish_site/categories.md','\n'.join(cats))

              for project in order:
                  group = [r for r in rows if r['project']==project]
                  page = ['---','layout: default',f'title: {project}','---','',f'# {project}','',f'대화 수: **{len(group)}개**','']
                  for r in group:
                      rel = '../' + r['path'].removeprefix('publish_site/').removesuffix('.md') + '.html'
                      safe_title = r['title'].replace('[','\\[').replace(']','\\]')
                      page.append(f'- [{safe_title}]({rel})')
                  page.append('')
                  zout.writestr(f'publish_site/category/{slug[project]}.md','\n'.join(page))

              search_items=[]
              for r in rows:
                  rel=r['path'].removeprefix('publish_site/').removesuffix('.md')+'.html'
                  search_items.append({'title':r['title'],'project':r['project'],'url':rel})
              payload_json=json.dumps(search_items,ensure_ascii=False).replace('</','<\\/')
              search_html='''---\nlayout: default\ntitle: 대화 검색\n---\n<h1>대화 검색</h1>\n<input id="q" type="search" placeholder="제목 또는 프로젝트 검색" style="width:100%;padding:.7rem;font-size:1rem">\n<p id="count"></p><ul id="results"></ul>\n<script>const items=__DATA__;const q=document.getElementById('q'),out=document.getElementById('results'),cnt=document.getElementById('count');function draw(){const s=q.value.trim().toLowerCase();const x=items.filter(v=>!s||(v.title+' '+v.project).toLowerCase().includes(s));cnt.textContent=x.length+'개';out.innerHTML=x.map(v=>'<li><a href="'+v.url+'">'+v.title.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')+'</a> — '+v.project+'</li>').join('');}q.addEventListener('input',draw);draw();</script>\n'''.replace('__DATA__', payload_json)
              zout.writestr('publish_site/search.html', search_html)

          shutil.copy2(tmp, 'GPT_PUBLIC_ARCHIVE_READY.zip')
          shutil.copy2(tmp, 'GPT_PUBLIC_ARCHIVE_READY(1).zip')
          tmp.unlink()

          report = []
          report.append(f'original_conversations={len(rows)+len(removed_paths)}')
          report.append(f'kept_conversations={len(rows)}')
          report.append(f'removed_conversations={len(removed_paths)}')
          for project in ['칼 융','프로이트','올더스 헉슬리','데이비드 호킨스','엘리스 베일리']:
              report.append(f'{project}={counts[project]}')
          report.append('stale_aux_removed=' + json.dumps(stale_aux_removed, ensure_ascii=False))
          pathlib.Path('_archive_prune_report.txt').write_text('\n'.join(report)+'\n', encoding='utf-8')
          print('\n'.join(report))
          PY
      - name: Commit pruned archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GPT_PUBLIC_ARCHIVE_READY.zip 'GPT_PUBLIC_ARCHIVE_READY(1).zip' _archive_prune_report.txt
          git commit -m 'Keep only selected book commentary project conversations' || exit 0
          git push
