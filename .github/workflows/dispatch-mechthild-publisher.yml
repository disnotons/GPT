name: Dispatch Mechthild webbook publisher

on:
  push:
    branches: [main]
    paths:
      - '초기불교_완전입문/site/mechthild/.trigger-publisher'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one-time publisher
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'publish-mechthild-once.yml',
              ref: 'main'
            });
