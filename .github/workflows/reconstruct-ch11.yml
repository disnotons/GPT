name: Reconstruct exact chapter 11

on:
  push:
    paths:
      - '.webbook-upload/ch11/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          target='초기불교_완전입문/11강_열반_무엇이_끝나는가_통합정제본.md'
          : > "$target"
          for n in 00 01 02; do
            cat ".webbook-upload/ch11/${n}.part" >> "$target"
            printf '\n' >> "$target"
          done
          cat '.webbook-upload/ch11/03.part' >> "$target"
          for n in 04 05 06 07; do
            cat ".webbook-upload/ch11/${n}.part" >> "$target"
            printf '\n' >> "$target"
          done
          cat '.webbook-upload/ch11/08.part' >> "$target"
          actual="$(git hash-object "$target")"
          expected='4bdaa80908e7c75f1d3ced37a347707ab663e0b4'
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"
          rm -rf .webbook-upload/ch11
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update Early Buddhism chapter 11 from supplied canonical file'
          git push
