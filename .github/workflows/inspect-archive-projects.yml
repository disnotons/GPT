name: Inspect archive conversation IDs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-archive-projects.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build current archive conversation inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile, re, pathlib
          zpath = pathlib.Path('GPT_PUBLIC_ARCHIVE_READY.zip')
          rows = []
          with zipfile.ZipFile(zpath) as z:
              for n in sorted(z.namelist()):
                  if not (n.startswith('publish_site/conversations/') and n.endswith('.md')):
                      continue
                  text = z.read(n).decode('utf-8','replace')
                  def meta(key):
                      m = re.search(rf'(?m)^{re.escape(key)}:\s*["\']?(.*?)["\']?\s*$', text[:5000])
                      return m.group(1).strip() if m else ''
                  cid = meta('conversation_id')
                  title = meta('title').replace('\t',' ').replace('\n',' ')
                  date = meta('date')
                  rows.append((n,cid,title,date))
          out = pathlib.Path('_archive_conversation_inventory.tsv')
          out.write_text('path\tconversation_id\ttitle\tdate\n' + ''.join('\t'.join(r)+'\n' for r in rows), encoding='utf-8')
          print('conversation_count', len(rows))
          PY
      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _archive_conversation_inventory.tsv
          git commit -m 'Inventory current GPT archive conversations' || exit 0
          git push
