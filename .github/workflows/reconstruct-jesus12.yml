name: Reconstruct Jesus Lesson 12

on:
  push:
    branches: [main]
    paths:
      - '예수_그리스도_완전입문/_upload12/**'
      - '.github/workflows/reconstruct-jesus12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all parts
        id: parts
        shell: bash
        run: |
          ok=1
          for n in $(seq -w 0 17); do
            test -f "예수_그리스도_완전입문/_upload12/part_${n}" || ok=0
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"
      - name: Reconstruct exact Markdown and clean temporary files
        if: steps.parts.outputs.ready == '1'
        shell: bash
        run: |
          target='예수_그리스도_완전입문/12강_돌아옴_진리_사랑_성령_평화_통합정제본.md'
          cat 예수_그리스도_완전입문/_upload12/part_* | base64 -d > "$target"
          rm -rf 예수_그리스도_완전입문/_upload12
          rm -f .github/workflows/reconstruct-jesus12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add Jesus course lesson 12'
          git push
