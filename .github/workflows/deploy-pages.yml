name: Deploy Archive and Reading Sites to Pages

on:
  push:
    branches: [main]
    paths:
      - 'GPT_PUBLIC_ARCHIVE_READY.zip'
      - '초기불교_완전입문/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack archive
        run: |
          rm -rf _site_src
          mkdir -p _site_src
          unzip -q GPT_PUBLIC_ARCHIVE_READY.zip -d _site_src
          test -f _site_src/publish_site/index.md

      - name: Stage Early Buddhism web book
        shell: bash
        run: |
          set -euo pipefail
          target="_site_src/publish_site/early-buddhism"
          mkdir -p "$target/content"
          cp -R "초기불교_완전입문/site/." "$target/"
          cp 초기불교_완전입문/*.md "$target/content/"
          rm -f "$target/content/README.md"
          test -f "$target/index.html"
          test -f "$target/style.css"
          test -f "$target/app.js"
          count="$(find "$target/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "chapter docs: $count"
          test "$count" = "13"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build existing archive and web book with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src/publish_site
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
