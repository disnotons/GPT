name: Deploy Archive and Reading Sites to Pages

on:
  push:
    branches: [main]
    paths:
      - 'GPT_PUBLIC_ARCHIVE_READY.zip'
      - '초기불교_완전입문/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete 13강 source
        shell: bash
        run: |
          set -euo pipefail
          if [ -d _repair13 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('_repair13')
          fix = root / 'fix'

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          replacements = {
              'part-01.b64': [3, 4],
              'part-02.b64': [2],
              'part-03.b64': [2, 5, 7],
              'part-04.b64': [4, 7],
              'part-07.b64': [9],
          }

          for name, blocks in replacements.items():
              path = root / name
              data = bytearray(path.read_bytes())
              if len(data) != 10000:
                  raise SystemExit(f'unexpected size for {name}: {len(data)}')
              stem = Path(name).stem
              for block in blocks:
                  patch = (fix / f'{stem}-b{block:02d}.txt').read_bytes()
                  if len(patch) != 1000:
                      raise SystemExit(f'bad patch size {stem}-b{block:02d}: {len(patch)}')
                  data[block*1000:(block+1)*1000] = patch
              path.write_bytes(data)

          # part-05 lost four Base64 characters early in the upload. Its remote
          # suffix from offset 996 onward is otherwise exact, so restore the
          # canonical first block and splice the verified suffix back in.
          p5 = root / 'part-05.b64'
          remote5 = p5.read_bytes()
          head5 = (fix / 'part-05-b00.txt').read_bytes()
          if len(remote5) != 9996 or len(head5) != 1000:
              raise SystemExit(f'unexpected part-05 sizes: remote={len(remote5)}, head={len(head5)}')
          p5.write_bytes(head5 + remote5[996:])

          # part-06 was heavily mixed during the original upload; reconstruct it
          # entirely from ten independently uploaded, small verified blocks.
          p6_blocks = []
          for block in range(10):
              patch = (fix / f'part-06-b{block:02d}.txt').read_bytes()
              if len(patch) != 1000:
                  raise SystemExit(f'bad part-06 patch size b{block:02d}: {len(patch)}')
              p6_blocks.append(patch)
          (root / 'part-06.b64').write_bytes(b''.join(p6_blocks))

          expected_parts = {
              'part-01.b64': '4477b7f8e94d4a00d57c6d299d3971e85d2e3e64',
              'part-02.b64': '70b10a22bfbab5498b5fedd93496a0f37643a857',
              'part-03.b64': 'f53f3f1af992d64c5a0e600ddf3d3aca57cd4c59',
              'part-04.b64': '5e2a3f8bbfaf0ff73a59b5c078134a194f60daf5',
              'part-05.b64': 'e513deb1739342d6f1ea8bcfd02b6814cce1f1a2',
              'part-06.b64': '228c43579bc94c8d7a065644e6a481fac979fb90',
              'part-07.b64': '8fa9a3dfc76ed5040e009cb0097b939775929add',
              'part-08.b64': '6068db3ac4762cac91de18b1986e32eb24200fda',
          }
          for name, expected in expected_parts.items():
              data = (root / name).read_bytes()
              got = git_blob_sha(data)
              print(f'{name}: {got}')
              if got != expected:
                  raise SystemExit(f'chunk verification failed for {name}: {got} != {expected}')
          PY

            cat _repair13/part-*.b64 | base64 -d > /tmp/ch13.md
            expected="9a2d44e540169160a47d774d9854440e88d1a9b5"
            got="$(git hash-object /tmp/ch13.md)"
            echo "decoded 13강 blob: $got"
            test "$got" = "$expected"

            target="$(find 초기불교_완전입문 -maxdepth 1 -type f -name '13강*통합정제본.md' -print -quit)"
            test -n "$target"
            cp /tmp/ch13.md "$target"
            test "$(git hash-object "$target")" = "$expected"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$target"
            git rm -r _repair13

            if ! git diff --cached --quiet; then
              git commit -m "Restore complete 13강 canonical source [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Unpack archive
        run: |
          rm -rf _site_src
          mkdir -p _site_src
          unzip -q GPT_PUBLIC_ARCHIVE_READY.zip -d _site_src
          test -f _site_src/publish_site/index.md

      - name: Stage Early Buddhism web book
        shell: bash
        run: |
          set -euo pipefail
          target="_site_src/publish_site/early-buddhism"
          mkdir -p "$target/content"
          cp -R "초기불교_완전입문/site/." "$target/"
          cp 초기불교_완전입문/*.md "$target/content/"
          rm -f "$target/content/README.md"
          test -f "$target/index.html"
          test -f "$target/style.css"
          test -f "$target/app.js"
          count="$(find "$target/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "chapter docs: $count"
          test "$count" = "13"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build existing archive and web book with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src/publish_site
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
