name: Diagnose AA Drive bundle download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-aa-drive-download.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download current bundle and verify
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 --retry-delay 1 -o /tmp/bundle.zip 'https://drive.usercontent.google.com/download?id=1zRRzjGyvPwIKR_TxWRXEG-TbGFYx8fRL&export=download&confirm=t'
          echo "bytes=$(stat -c%s /tmp/bundle.zip)"
          sha256sum /tmp/bundle.zip
          unzip -t /tmp/bundle.zip >/dev/null
