name: AA Drive download diagnostic

on:
  push:
    branches: [main]
    paths:
      - '초기불교/aa/.trigger-aa-drive-diagnostic'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test gdown and record result
        shell: bash
        run: |
          set +e
          log='.webbook-upload/aa-traditions-detailed/drive-download.log'
          rm -f /tmp/aa-drive.zip
          {
            python -m pip install --quiet gdown
            echo 'Testing gdown'
            gdown '1kUnZMmIHhB0F0CfZ-WDnawr5w9jtsTwK' -O /tmp/aa-drive.zip
            s=$?
            echo "gdown_status=$s"
            if [ -f /tmp/aa-drive.zip ]; then
              stat -c 'size=%s' /tmp/aa-drive.zip
              sha256sum /tmp/aa-drive.zip
              file /tmp/aa-drive.zip
              unzip -t /tmp/aa-drive.zip | tail -5
            fi
          } > "$log" 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$log"
          git commit -m 'Record AA Drive gdown diagnostic'
          git push origin HEAD:main
