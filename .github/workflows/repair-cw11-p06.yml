name: Repair CW11 p06

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-cw11-p06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover missing byte in p06-a
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('융_CW11_심리학과_종교/source-archive/fix')
          a = (root/'p06-a').read_bytes()
          b = (root/'p06-b').read_bytes()
          expected = 'b61369d4e7ba3a901e649981f52f3344e93e68c0'

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          if len(a) == 10000 and blob_sha(a+b) == expected:
              print('p06 already correct')
              raise SystemExit(0)
          if len(a) != 9999 or len(b) != 10000:
              raise SystemExit(f'unexpected sizes: a={len(a)} b={len(b)}')

          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          header = f'blob {20000}\0'.encode()
          found = None
          # Fast-path: missing byte is usually at an edge.
          for pos in (len(a), 0):
              for ch in alphabet:
                  cand = a[:pos] + bytes([ch]) + a[pos:]
                  if blob_sha(cand+b) == expected:
                      found = cand
                      break
              if found is not None:
                  break

          if found is None:
              for pos in range(1, len(a)):
                  prefix = a[:pos]
                  suffix = a[pos:] + b
                  h0 = hashlib.sha1()
                  h0.update(header)
                  h0.update(prefix)
                  for ch in alphabet:
                      h = h0.copy()
                      h.update(bytes([ch]))
                      h.update(suffix)
                      if h.hexdigest() == expected:
                          found = prefix + bytes([ch]) + a[pos:]
                          print(f'found missing byte at offset {pos}: {chr(ch)!r}')
                          break
                  if found is not None:
                      break

          if found is None:
              raise SystemExit('could not recover p06-a')
          if len(found) != 10000 or blob_sha(found+b) != expected:
              raise SystemExit('recovered data failed verification')
          (root/'p06-a').write_bytes(found)
          print('p06-a repaired and verified')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '융_CW11_심리학과_종교/source-archive/fix/p06-a'
          if ! git diff --cached --quiet; then
            git commit -m 'Repair exact CW11 p06-a [skip ci]'
            git push origin HEAD:main
          fi
