name: Publish AA Twelve Traditions detailed webbook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aa-traditions-detailed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown pyyaml
          gdown '1kUnZMmIHhB0F0CfZ-WDnawr5w9jtsTwK' -O /tmp/aa-traditions.zip
          echo 'ee5e6d4cd7be145a3f9652d76a85fc6bcc96e01632f91fe2abd0b0f263582076  /tmp/aa-traditions.zip' | sha256sum -c -
          rm -rf /tmp/aa-src
          mkdir -p /tmp/aa-src
          unzip -q /tmp/aa-traditions.zip -d /tmp/aa-src

      - name: Build chaptered webbook without changing source text
        shell: bash
        run: |
          set -euo pipefail
          target='초기불교/aa/traditions-detailed'
          test ! -e "$target"
          mkdir -p "$target/content"
          python - <<'PY'
          from pathlib import Path
          import re, json, shutil, yaml

          root = Path('/tmp/aa-src')
          target = Path('초기불교/aa/traditions-detailed')
          all_md = list(root.rglob('*.md'))
          integrated = [p for p in all_md if p.name == 'AA_12전통_상세분석해설_전체통합본_친절한설명조.md']
          assert len(integrated) == 1, integrated
          individual = [p for p in all_md if p.name.startswith('AA_12전통_상세분석해설_') and p.name != integrated[0].name]
          assert len(individual) == 74, len(individual)

          def parse(p):
              m = re.match(r'AA_12전통_상세분석해설_((?:\d+|A)\.(\d+))_(.+)_친절한설명조\.md$', p.name)
              assert m, p.name
              code, sub, raw_title = m.group(1), m.group(2), m.group(3)
              major = code.split('.')[0]
              if major == 'A':
                  out_id, sort_key = f'A-{int(sub):02d}', (99, int(sub))
              else:
                  out_id, sort_key = f'{int(major):02d}-{int(sub):02d}', (int(major), int(sub))
              text = p.read_text(encoding='utf-8')
              h2 = next((line[3:].strip() for line in text.splitlines() if line.startswith('## ')), None)
              assert h2 and code in h2, (p.name, h2)
              title = h2.split('—', 1)[-1].strip()
              return sort_key, out_id, title, f'{out_id}_{raw_title}.md', text

          parsed = [parse(p) + (p,) for p in individual]
          parsed.sort(key=lambda x: x[0])
          chapters = []
          for _, out_id, title, out_name, text, src in parsed:
              out = target / 'content' / out_name
              out.write_text(text, encoding='utf-8')
              assert out.read_bytes() == src.read_bytes()
              chapters.append({'id': out_id, 'title': title, 'file': f'content/{out_name}', 'source_file': src.name})

          shutil.copyfile(integrated[0], target / 'book.md')
          assert (target / 'book.md').read_bytes() == integrated[0].read_bytes()

          meta = {
              'title': 'AA Twelve Traditions 상세 분석·해설',
              'category': '회복·AA',
              'collection': 'AA 12단계·12전통',
              'series': 'Twelve Traditions',
              'description': 'AA Twelve Traditions를 세부 주제별로 읽을 수 있도록 구성한 상세 분석·해설 웹북.',
              'language': 'ko',
              'status': 'complete',
              'chapters': chapters,
          }
          (target / 'book.yaml').write_text(yaml.safe_dump(meta, allow_unicode=True, sort_keys=False), encoding='utf-8')
          (target / 'book.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (target / 'README.md').write_text(
              '# AA Twelve Traditions 상세 분석·해설 웹북\n\n'
              '- 범위: Tradition One 1.1 ~ Tradition Twelve 12.6 + Long Form A.1 ~ A.4\n'
              '- 개별 해설: 74개\n'
              '- `content/`의 본문은 원본 MD에서 문자열을 수정하지 않고 그대로 복사했습니다.\n'
              '- `book.md`는 원본 전체 통합본을 그대로 복사했습니다.\n',
              encoding='utf-8'
          )
          PY

          cat > "$target/index.html" <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="description" content="AA Twelve Traditions 상세 분석·해설 웹북">
            <title>AA Twelve Traditions 상세 분석·해설</title>
            <link rel="stylesheet" href="./style.css">
            <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
          </head>
          <body>
            <header class="topbar">
              <button id="menuBtn" aria-label="목차 열기">☰</button>
              <div class="brand"><strong>AA Twelve Traditions</strong><span>상세 분석·해설</span></div>
              <div class="actions"><a href="./book.md">통합 MD</a><button id="themeBtn" aria-label="테마 전환">◐</button></div>
            </header>
            <div class="layout">
              <aside id="sidebar"><div class="side-inner"><input id="search" type="search" placeholder="목차 검색"><nav id="toc"></nav></div></aside>
              <main>
                <article id="content"><p>웹북을 불러오는 중입니다…</p></article>
                <nav class="pager"><button id="prevBtn">← 이전</button><span id="position"></span><button id="nextBtn">다음 →</button></nav>
              </main>
            </div>
            <button id="topBtn" class="top-btn" aria-label="맨 위로">↑</button>
            <script src="./app.js"></script>
          </body>
          </html>
          HTML

          cat > "$target/style.css" <<'CSS'
          :root{color-scheme:light;--bg:#f5f3ee;--paper:#fffdfa;--text:#282720;--muted:#77736b;--line:#ded9cf;--accent:#31594d;--soft:#e8efec;--top:64px;--side:330px}
          html[data-theme=dark]{color-scheme:dark;--bg:#151815;--paper:#1d211e;--text:#ecece5;--muted:#b4b4ac;--line:#363b37;--accent:#9bc6b7;--soft:#26352f}
          *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.78}
          a{color:var(--accent)}button,input{font:inherit}.topbar{position:fixed;z-index:30;inset:0 0 auto;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--paper)}
          .topbar button,.topbar a,.pager button{border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--text);padding:8px 11px;text-decoration:none;cursor:pointer}
          .brand{display:flex;flex-direction:column;line-height:1.2}.brand strong{font-size:15px}.brand span{font-size:12px;color:var(--muted);margin-top:3px}.actions{margin-left:auto;display:flex;gap:8px}
          .layout{min-height:100vh;padding-top:var(--top)}aside{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);overflow:auto;border-right:1px solid var(--line);background:var(--paper);z-index:20}.side-inner{padding:18px 16px 42px}
          #search{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}#toc{margin-top:14px}#toc h3{font-size:12px;color:var(--muted);margin:18px 8px 6px}
          #toc a{display:block;padding:7px 9px;border-radius:8px;text-decoration:none;color:var(--text);font-size:13px;line-height:1.4}#toc a:hover,#toc a.active{background:var(--soft);color:var(--accent)}
          main{margin-left:var(--side);padding:30px 36px 90px}#content{width:min(100%,900px);margin:auto;padding:46px 52px 70px;border:1px solid var(--line);border-radius:18px;background:var(--paper)}
          #content h1{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.25}#content h2{margin-top:2.2em;font-size:1.45rem}#content h3{margin-top:2em;font-size:1.18rem}#content blockquote{margin:22px 0;padding:10px 18px;border-left:4px solid var(--accent);background:var(--soft)}
          #content table{display:block;overflow:auto;border-collapse:collapse}#content th,#content td{border:1px solid var(--line);padding:8px 10px}.pager{width:min(100%,900px);margin:18px auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.pager button:disabled{opacity:.4;cursor:default}#position{font-size:12px;color:var(--muted);text-align:center}
          .top-btn{position:fixed;right:20px;bottom:20px;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--text);cursor:pointer}#menuBtn{display:none}
          @media(max-width:900px){:root{--side:min(88vw,350px)}#menuBtn{display:block}aside{transform:translateX(-105%);transition:.2s}aside.open{transform:translateX(0)}main{margin-left:0;padding:16px 10px 70px}#content{padding:30px 20px 55px}.actions a{display:none}}
          CSS

          cat > "$target/app.js" <<'JS'
          (()=>{const $=s=>document.querySelector(s),toc=$('#toc'),content=$('#content'),sidebar=$('#sidebar');let chapters=[],current=0;
          const groupName=id=>id.startsWith('A-')?'Long Form 부록':`Tradition ${Number(id.slice(0,2))}`;
          const saved=localStorage.getItem('aa-traditions-detail-theme');if(saved)document.documentElement.dataset.theme=saved;
          $('#themeBtn').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('aa-traditions-detail-theme',n)};
          $('#menuBtn').onclick=()=>sidebar.classList.toggle('open');$('#topBtn').onclick=()=>scrollTo({top:0,behavior:'smooth'});
          function buildToc(){toc.innerHTML='';let g='';chapters.forEach((c,i)=>{const ng=groupName(c.id);if(ng!==g){g=ng;const h=document.createElement('h3');h.textContent=g;toc.appendChild(h)}const a=document.createElement('a');a.href=`#${c.id}`;a.textContent=`${c.id.replace('-', '.')} ${c.title}`;a.dataset.i=i;a.dataset.search=a.textContent.toLowerCase();toc.appendChild(a)})}
          $('#search').oninput=()=>{const q=$('#search').value.trim().toLowerCase();toc.querySelectorAll('a').forEach(a=>a.hidden=!!q&&!a.dataset.search.includes(q))};
          async function openChapter(i,push=true){if(i<0||i>=chapters.length)return;current=i;const c=chapters[i],r=await fetch('./'+encodeURI(c.file),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);content.innerHTML=marked.parse(await r.text());document.title=`${c.id.replace('-', '.')} ${c.title} · AA Twelve Traditions`;toc.querySelectorAll('a').forEach(a=>a.classList.toggle('active',Number(a.dataset.i)===i));$('#prevBtn').disabled=i===0;$('#nextBtn').disabled=i===chapters.length-1;$('#position').textContent=`${i+1} / ${chapters.length}`;if(push)history.replaceState(null,'',`#${c.id}`);sidebar.classList.remove('open');scrollTo({top:0})}
          $('#prevBtn').onclick=()=>openChapter(current-1);$('#nextBtn').onclick=()=>openChapter(current+1);
          fetch('./book.json',{cache:'no-store'}).then(r=>r.json()).then(m=>{chapters=m.chapters;buildToc();toc.onclick=e=>{const a=e.target.closest('a');if(a){e.preventDefault();openChapter(Number(a.dataset.i))}};const id=decodeURIComponent(location.hash.slice(1)),i=Math.max(0,chapters.findIndex(c=>c.id===id));return openChapter(i,false)}).catch(e=>content.innerHTML=`<h1>웹북을 불러오지 못했습니다</h1><p>${e.message}</p>`);})();
          JS

          test -f "$target/book.yaml"
          test -f "$target/book.json"
          test -f "$target/book.md"
          test "$(find "$target/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = "74"

      - name: Patch shared Pages workflow to stage this independent webbook
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-pages.yml')
          s=p.read_text(encoding='utf-8')
          if 'Stage AA Twelve Traditions detailed web book' not in s:
              marker='      - name: Stage Hawkins mobile web books\n'
              insert='''      - name: Stage AA Twelve Traditions detailed web book
        shell: bash
        run: |
          set -euo pipefail
          src="초기불교/aa/traditions-detailed"
          target="_site_src/publish_site/aa/traditions-detailed"
          test -f "$src/index.html"
          test -f "$src/book.yaml"
          test -f "$src/book.json"
          test "$(find "$src/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = "74"
          rm -rf "$target"
          mkdir -p "$target"
          cp -R "$src/." "$target/"

'''
              assert marker in s
              s=s.replace(marker,insert+marker,1)
          if 'Verify AA Twelve Traditions detailed in built artifact' not in s:
              marker='      - name: Ensure CW11 in final Pages artifact\n'
              insert='''      - name: Verify AA Twelve Traditions detailed in built artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/aa/traditions-detailed/index.html
          test -f _site/aa/traditions-detailed/book.json
          test -f _site/aa/traditions-detailed/book.yaml
          test "$(find _site/aa/traditions-detailed/content -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = "74"

'''
              assert marker in s
              s=s.replace(marker,insert+marker,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '초기불교/aa/traditions-detailed' '.github/workflows/deploy-pages.yml'
          git commit -m 'Publish AA Twelve Traditions detailed webbook'
          git push origin HEAD:main
