name: Publish Hawkins mobile webbooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hawkins-mobile.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect existing public archive for Hawkins sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/archive
          mkdir -p /tmp/archive
          unzip -q GPT_PUBLIC_ARCHIVE_READY.zip -d /tmp/archive
          {
            echo '=== filenames containing likely Hawkins/Truth/Modern terms ==='
            find /tmp/archive -type f | sed 's#^/tmp/archive/##' | grep -Ei 'hawkins|truth|falsehood|의식|진실|거짓|modern|conscious' || true
            echo
            echo '=== conversation/export files ==='
            find /tmp/archive -type f | sed 's#^/tmp/archive/##' | grep -Ei 'conversation|json|project' | head -n 500 || true
            echo
            echo '=== text hits for target Korean titles ==='
            grep -RIl --exclude='*.zip' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' -E '진실 대 거짓|현대인의 의식 지도|Truth vs.? Falsehood|Reality, Spirituality and Modern Man' /tmp/archive 2>/dev/null | sed 's#^/tmp/archive/##' | head -n 200 || true
          } > hawkins-archive-inventory.txt

      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hawkins-archive-inventory.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inventory Hawkins sources in public archive'
          git push origin HEAD:main
