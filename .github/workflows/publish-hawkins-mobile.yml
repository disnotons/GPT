name: Scan Hawkins archive coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hawkins-mobile.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all manifest IDs
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT='536a7997ad639ba9e512dd389c64c54afe231f5d'
          rm -rf /tmp/hawkins-archive /tmp/hawkins-source.zip
          mkdir -p /tmp/hawkins-archive
          git show "$SOURCE_COMMIT:GPT_PUBLIC_ARCHIVE_READY.zip" > /tmp/hawkins-source.zip
          unzip -q /tmp/hawkins-source.zip 'publish_site/conversations/*' -d /tmp/hawkins-archive
          python - <<'PY'
          import json,re
          from pathlib import Path
          manifest=json.loads(Path('hawkins-mobile/source-manifest.json').read_text(encoding='utf-8'))
          ids=set()
          for p in Path('/tmp/hawkins-archive/publish_site/conversations').glob('*.md'):
              t=p.read_text(encoding='utf-8',errors='replace')[:5000]
              m=re.search(r'(?m)^conversation_id:\s*["\']?(.*?)["\']?\s*$',t)
              if m: ids.add(m.group(1).strip())
          report={'source_commit':'536a7997ad639ba9e512dd389c64c54afe231f5d','archive_ids':len(ids),'books':{}}
          for book,chapters in manifest.items():
              out={}
              for ch,cids in chapters.items():
                  check=list(cids)
                  if book=='truth' and ch=='3': check=['6a702be1-1ca8-83ee-b0cd-cdc8580d98f9']
                  miss=[x for x in check if x not in ids]
                  if miss: out[ch]=miss
              report['books'][book]=out
          Path('hawkins-mobile/archive-missing-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hawkins-mobile/archive-missing-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Hawkins archive coverage'
            git push origin HEAD:main
          fi
