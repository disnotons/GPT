name: Deploy Archive and Reading Sites to Pages

on:
  push:
    branches: [main]
    paths:
      - 'GPT_PUBLIC_ARCHIVE_READY.zip'
      - '초기불교_완전입문/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete 13강 source
        shell: bash
        run: |
          set -euo pipefail
          if [ -d _repair13 ]; then
            python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for p in sorted(Path('_repair13').glob('part-*.b64')):
              data = p.read_bytes()
              print(f'BLOCKS {p.name} size={len(data)}')
              for i in range(0, len(data), 1000):
                  print(f'  {i//1000:02d} {hashlib.sha256(data[i:i+1000]).hexdigest()[:16]}')
          PY
            cat _repair13/part-*.b64 | base64 -d > /tmp/ch13.md
            expected="9a2d44e540169160a47d774d9854440e88d1a9b5"
            got="$(git hash-object /tmp/ch13.md)"
            echo "decoded 13강 blob: $got"
            test "$got" = "$expected"

            target="$(find 초기불교_완전입문 -maxdepth 1 -type f -name '13강*통합정제본.md' -print -quit)"
            test -n "$target"
            cp /tmp/ch13.md "$target"
            test "$(git hash-object "$target")" = "$expected"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$target"
            git rm -r _repair13

            if ! git diff --cached --quiet; then
              git commit -m "Restore complete 13강 canonical source [skip ci]"
              git push origin HEAD:main
            fi
          fi

      - name: Unpack archive
        run: |
          rm -rf _site_src
          mkdir -p _site_src
          unzip -q GPT_PUBLIC_ARCHIVE_READY.zip -d _site_src
          test -f _site_src/publish_site/index.md

      - name: Stage Early Buddhism web book
        shell: bash
        run: |
          set -euo pipefail
          target="_site_src/publish_site/early-buddhism"
          mkdir -p "$target/content"
          cp -R "초기불교_완전입문/site/." "$target/"
          cp 초기불교_완전입문/*.md "$target/content/"
          rm -f "$target/content/README.md"
          test -f "$target/index.html"
          test -f "$target/style.css"
          test -f "$target/app.js"
          count="$(find "$target/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')"
          echo "chapter docs: $count"
          test "$count" = "13"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build existing archive and web book with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src/publish_site
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
