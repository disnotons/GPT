name: Validate Hawkins mobile builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hawkins-mobile.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and record result
        shell: bash
        run: |
          set -u
          SOURCE_COMMIT='536a7997ad639ba9e512dd389c64c54afe231f5d'
          rm -rf /tmp/hawkins-archive /tmp/hawkins-output /tmp/hawkins-source.zip /tmp/hawkins.log
          mkdir -p /tmp/hawkins-archive /tmp/hawkins-output
          python - <<'PY'
          from pathlib import Path
          p=Path('hawkins-mobile/build_hawkins.py')
          s=p.read_text(encoding='utf-8')
          old='if key == "truth" and ch >= 16:'
          new='if key == "truth" and (recon_dir / f"chapter-{ch}.md").exists():'
          if old in s:
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          elif new not in s:
              raise SystemExit('Could not locate direct-source condition in builder')
          PY
          set +e
          git show "$SOURCE_COMMIT:GPT_PUBLIC_ARCHIVE_READY.zip" > /tmp/hawkins-source.zip 2>/tmp/hawkins.log
          rc=$?
          if [ "$rc" -eq 0 ]; then unzip -t /tmp/hawkins-source.zip >>/tmp/hawkins.log 2>&1; rc=$?; fi
          if [ "$rc" -eq 0 ]; then unzip -q /tmp/hawkins-source.zip 'publish_site/conversations/*' -d /tmp/hawkins-archive >>/tmp/hawkins.log 2>&1; rc=$?; fi
          if [ "$rc" -eq 0 ]; then
            python hawkins-mobile/build_hawkins.py \
              --conversations /tmp/hawkins-archive/publish_site/conversations \
              --manifest hawkins-mobile/source-manifest.json \
              --reconstructed hawkins-mobile/truth-reconstructed \
              --output /tmp/hawkins-output >>/tmp/hawkins.log 2>&1
            rc=$?
          fi
          set -e
          {
            echo "exit_code=$rc"
            echo "source_commit=$SOURCE_COMMIT"
            echo '--- build log ---'
            cat /tmp/hawkins.log
          } > hawkins-mobile/validation-status.txt
          if [ -f /tmp/hawkins-output/build-report.json ]; then
            cp /tmp/hawkins-output/build-report.json hawkins-mobile/validation-report.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hawkins-mobile/validation-status.txt
          if [ -f hawkins-mobile/validation-report.json ]; then git add hawkins-mobile/validation-report.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record Hawkins mobile validation result'
            git push origin HEAD:main
          fi
