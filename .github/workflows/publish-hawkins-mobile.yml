name: Diagnose Hawkins mobile webbooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hawkins-mobile.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run builder and capture result
        shell: bash
        run: |
          set -u
          SOURCE_COMMIT='536a7997ad639ba9e512dd389c64c54afe231f5d'
          rm -rf /tmp/hawkins-archive /tmp/hawkins-source.zip /tmp/hawkins-output /tmp/hawkins-build.log
          mkdir -p /tmp/hawkins-archive /tmp/hawkins-output
          {
            set -x
            git show "$SOURCE_COMMIT:GPT_PUBLIC_ARCHIVE_READY.zip" > /tmp/hawkins-source.zip
            unzip -t /tmp/hawkins-source.zip >/dev/null
            unzip -q /tmp/hawkins-source.zip 'publish_site/conversations/*' -d /tmp/hawkins-archive
            python hawkins-mobile/build_hawkins.py \
              --conversations /tmp/hawkins-archive/publish_site/conversations \
              --manifest hawkins-mobile/source-manifest.json \
              --reconstructed hawkins-mobile/truth-reconstructed \
              --output /tmp/hawkins-output
          } > /tmp/hawkins-build.log 2>&1
          rc=$?
          {
            echo "exit_code=$rc"
            echo "source_commit=$SOURCE_COMMIT"
            echo '--- build log ---'
            cat /tmp/hawkins-build.log
          } > hawkins-mobile/validation-status.txt
          if [ -f /tmp/hawkins-output/build-report.json ]; then
            cp /tmp/hawkins-output/build-report.json hawkins-mobile/validation-report.json
          else
            rm -f hawkins-mobile/validation-report.json
          fi
          exit 0

      - name: Commit diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A hawkins-mobile/validation-status.txt hawkins-mobile/validation-report.json || true
          if git diff --cached --quiet; then
            echo 'Diagnostic result unchanged.'
            exit 0
          fi
          git commit -m 'Record Hawkins mobile build diagnostics'
          git push origin HEAD:main
