<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4efe5" />
  <meta name="description" content="임제록 제1부부터 제5부까지 읽는 통합 해설 웹북" />
  <title>『임제록』 통합 해설</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="progress" class="progress" aria-hidden="true"></div>

  <header class="topbar">
    <button id="menuButton" class="icon-button mobile-only" aria-label="목차 열기" aria-expanded="false">☰</button>
    <a class="brand" href="#part=1" aria-label="임제록 통합 해설 첫 부분으로">
      <span class="brand-kicker">LINJI LU · 臨濟錄</span>
      <strong>『임제록』 통합 해설</strong>
    </a>
    <div class="top-actions">
      <button id="themeButton" class="icon-button" aria-label="화면 테마 변경" title="화면 테마 변경">◐</button>
      <a class="github-link" href="https://github.com/disnotons/GPT/tree/main/임제록_통합해설" target="_blank" rel="noopener">GitHub</a>
    </div>
  </header>

  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="웹북 목차">
      <div class="sidebar-inner">
        <div class="sidebar-head">
          <span>읽기 목차</span>
          <button id="closeMenuButton" class="icon-button mobile-only" aria-label="목차 닫기">×</button>
        </div>
        <nav id="partNav" class="chapter-nav"></nav>
        <div class="sidebar-note">
          <p>제1부 시중부터 제5부 전체 통합까지 순서대로 읽도록 구성했습니다.</p>
          <p>본문은 최종감수본 Markdown을 내용 변경 없이 그대로 불러옵니다.</p>
        </div>
      </div>
    </aside>

    <div id="scrim" class="scrim" hidden></div>

    <main class="reader" id="reader">
      <div class="reader-toolbar">
        <span id="partBadge" class="chapter-badge">제1부 / 5부</span>
        <span id="readingStatus" class="reading-status" aria-live="polite">불러오는 중…</span>
      </div>

      <article id="content" class="markdown-body" tabindex="-1">
        <div class="loading-card">본문을 불러오고 있습니다.</div>
      </article>

      <nav class="pager" aria-label="이전 및 다음 부">
        <button id="prevButton" class="pager-button prev" type="button"></button>
        <button id="nextButton" class="pager-button next" type="button"></button>
      </nav>

      <footer class="book-footer">
        <p>『임제록』 통합 해설 · 임제 의현 선사님 원전 × 호킨스 박사님 구조적 비교</p>
      </footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
