name: Deploy verified CW11 webbook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cw11-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack public archive
        run: |
          rm -rf _site_src _site
          mkdir -p _site_src
          unzip -q GPT_PUBLIC_ARCHIVE_READY.zip -d _site_src
          test -f _site_src/publish_site/index.md

      - name: Preserve Early Buddhism webbook
        shell: bash
        run: |
          set -euo pipefail
          t='_site_src/publish_site/early-buddhism'
          mkdir -p "$t/content"
          cp -R '초기불교_완전입문/site/.' "$t/"
          cp 초기불교_완전입문/*.md "$t/content/"
          rm -f "$t/content/README.md"

      - name: Preserve Jesus webbook
        shell: bash
        run: |
          set -euo pipefail
          t='_site_src/publish_site/jesus'
          mkdir -p "$t/content"
          cp -R '예수_그리스도_완전입문/site/.' "$t/"
          cp 예수_그리스도_완전입문/*.md "$t/content/"
          rm -f "$t/content/README.md"
          if compgen -G '예수_그리스도_완전입문/site/_chapter5/part-*.md' > /dev/null; then
            cat 예수_그리스도_완전입문/site/_chapter5/part-*.md > "$t/content/5강_재물_염려_마음의_방향_통합정제본.md"
            rm -rf "$t/_chapter5"
          fi
          if compgen -G '예수_그리스도_완전입문/site/_chapter12/part-*.md' > /dev/null; then
            cat 예수_그리스도_완전입문/site/_chapter12/part-*.md > "$t/content/12강_돌아옴_진리_사랑_성령_평화_통합정제본.md"
            rm -rf "$t/_chapter12"
          fi

      - name: Stage verified CW11 webbook
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile

          root = Path('융_CW11_심리학과_종교/source-archive')
          fix = root / 'fix'

          def blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          expected = [
              'b14bce8b3877a515ceb485c4e857fab889e301e0',
              'eff32db7d2430a857ae47a063df1227ba93bf67f',
              '6b1dcc438d309faaa9bdd50b237a4a1541b0d65a',
              '734efd15cddeb96bd721176d0516e1aa3831d050',
              'f78f9d6e1907e4f0a5232ed362764b746a748333',
              '3b858632e73e63c7fdc57147129d0fd34e56ae98',
              'b61369d4e7ba3a901e649981f52f3344e93e68c0',
              '51c9b6c1d40c441f6251fd01f6a910249c2f34ce',
              'cad41e5793a4fcd6c42ab402e2eb8791f0f104fb',
              '79a3863ea3564b991f72952fc596423a1cb887e6',
          ]
          parts = [
              (root/'part-00.b64').read_bytes(),
              (fix/'p01-0').read_bytes() + (fix/'p01-1').read_bytes(),
              (root/'part-02.b64').read_bytes()[:20000],
              (root/'part-03.b64').read_bytes(),
              (fix/'p04-a').read_bytes() + (fix/'p04-b').read_bytes(),
              (fix/'p05-a').read_bytes() + (fix/'p05-b').read_bytes(),
              (fix/'p06-a').read_bytes() + (fix/'p06-b').read_bytes(),
              (fix/'p07-0').read_bytes() + (fix/'p07-1').read_bytes(),
              (fix/'p08-0').read_bytes() + (fix/'p08-1').read_bytes(),
              (fix/'p09-0').read_bytes(),
          ]
          for i,(part,want) in enumerate(zip(parts,expected)):
              got=blob_sha(part)
              print(f'part-{i:02d}: {len(part)} bytes {got}')
              if got != want:
                  raise SystemExit(f'part-{i:02d} verification failed')

          payload=b''.join(parts)
          if len(payload)!=189592:
              raise SystemExit(f'bad payload length {len(payload)}')
          archive=base64.b64decode(payload, validate=True)
          got=hashlib.sha256(archive).hexdigest()
          want='153ec9d95e363a501965752cd2f285d7a4733a6065d75e21f31984911c779096'
          print('archive sha256:',got)
          if got != want:
              raise SystemExit('archive sha256 mismatch')
          Path('/tmp/cw11_sources.tar.gz').write_bytes(archive)
          PY

          t='_site_src/publish_site/cw11'
          rm -rf "$t"
          mkdir -p "$t/content"
          cp -R '융_CW11_심리학과_종교/site/.' "$t/"
          tar -xzf /tmp/cw11_sources.tar.gz -C "$t/content"
          test -f "$t/index.html"
          test -f "$t/style.css"
          test -f "$t/app.js"
          test "$(find "$t/content" -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = '9'

      - uses: actions/configure-pages@v5
      - name: Build Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src/publish_site
          destination: ./_site
      - name: Verify built CW11
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/cw11/index.html
          test -f _site/cw11/app.js
          test "$(find _site/cw11/content -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')" = '9'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
