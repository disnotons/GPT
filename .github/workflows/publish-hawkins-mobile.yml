name: Validate Hawkins mobile webbooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hawkins-mobile.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build from historical full archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT='536a7997ad639ba9e512dd389c64c54afe231f5d'
          rm -rf /tmp/hawkins-archive /tmp/hawkins-source.zip /tmp/hawkins-output
          mkdir -p /tmp/hawkins-archive /tmp/hawkins-output
          git show "$SOURCE_COMMIT:GPT_PUBLIC_ARCHIVE_READY.zip" > /tmp/hawkins-source.zip
          unzip -t /tmp/hawkins-source.zip >/dev/null
          unzip -q /tmp/hawkins-source.zip 'publish_site/conversations/*' -d /tmp/hawkins-archive
          python hawkins-mobile/build_hawkins.py \
            --conversations /tmp/hawkins-archive/publish_site/conversations \
            --manifest hawkins-mobile/source-manifest.json \
            --reconstructed hawkins-mobile/truth-reconstructed \
            --output /tmp/hawkins-output
          cp /tmp/hawkins-output/build-report.json hawkins-mobile/validation-report.json
          test -f /tmp/hawkins-output/truth-vs-falsehood-mobile/index.md
          test -f /tmp/hawkins-output/modern-consciousness-map-mobile/index.md
          if grep -RIl 'docs.google.com' /tmp/hawkins-output; then
            echo 'Unexpected Google Docs link in generated Hawkins content.'
            exit 1
          fi

      - name: Commit validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hawkins-mobile/validation-report.json
          if git diff --cached --quiet; then
            echo 'Validation report unchanged.'
            exit 0
          fi
          git commit -m 'Validate Hawkins mobile webbook build'
          git push origin HEAD:main
